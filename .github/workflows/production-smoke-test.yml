name: Production Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Submit synthetic survey response
        id: post
        run: |
          set -euo pipefail
          ENDPOINT='https://script.google.com/macros/s/AKfycbzooZrV11LSDK1MjDQiXhYmjmrduUUochp09WUBVeGb0tD5LhmQOLbZg1RIKJPeKZ_d-Q/exec'
          RID="smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$RID" > response-id.txt

          curl --fail-with-body -sSL -D post-headers.txt -o post-body.txt -X POST "$ENDPOINT" \
            --data-urlencode "responseId=$RID" \
            --data-urlencode "role=Resident" \
            --data-urlencode "neighborhood=Other / Prefer not to say" \
            --data-urlencode "priorities=Housing affordability" \
            --data-urlencode "registered=Prefer not to say" \
            --data-urlencode "votedLocal=Prefer not to say" \
            --data-urlencode "association=No" \
            --data-urlencode "responsibilities=Residents themselves" \
            --data-urlencode "actions=Participate in cleanups / improvement projects" \
            --data-urlencode "source=automated-smoke-test" \
            --data-urlencode "campaign=production-launch-test"

          echo '=== Response Headers ==='
          cat post-headers.txt
          echo '=== Response Body ==='
          cat post-body.txt

          if ! grep -qx 'ok' post-body.txt; then
            echo 'ERROR: Apps Script POST did not return the expected exact body: ok'
            exit 1
          fi

      - name: Verify Apps Script summary endpoint
        id: get
        run: |
          set -euo pipefail
          ENDPOINT='https://script.google.com/macros/s/AKfycbzooZrV11LSDK1MjDQiXhYmjmrduUUochp09WUBVeGb0tD5LhmQOLbZg1RIKJPeKZ_d-Q/exec'
          curl --fail-with-body -sSL -D get-headers.txt -o summary.json "$ENDPOINT?action=summary"
          echo '=== Summary Headers ==='
          cat get-headers.txt
          echo '=== Summary Body ==='
          cat summary.json

          if ! grep -q '"ok":true' summary.json; then
            echo 'ERROR: Apps Script summary endpoint is not healthy.'
            exit 1
          fi

      - name: Verify public site and deployed config
        id: site
        run: |
          set -euo pipefail
          SITE='https://melrah-one-schenectady-ctsllc-pngs-projects.vercel.app'

          for i in 1 2 3 4 5 6; do
            if curl --fail-with-body -sSL "$SITE/config.js" -o config.js && \
               grep -q 'AKfycbzooZrV11LSDK1MjDQiXhYmjmrduUUochp09WUBVeGb0tD5LhmQOLbZg1RIKJPeKZ_d-Q' config.js; then
              break
            fi
            if [ "$i" -eq 6 ]; then
              echo 'ERROR: Production config.js did not expose the expected Apps Script endpoint.'
              exit 1
            fi
            sleep 20
          done

          curl --fail-with-body -sSL "$SITE/" -o index.html
          curl --fail-with-body -sSL "$SITE/survey.html" -o survey.html
          grep -qi 'ONE SCHENECTADY' index.html
          grep -qi 'survey' survey.html

      - name: Report smoke-test status
        run: |
          echo 'POST=success'
          echo 'GET=success'
          echo 'SITE=success'

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-test-evidence
          path: |
            response-id.txt
            post-headers.txt
            post-body.txt
            get-headers.txt
            summary.json
            config.js
            index.html
            survey.html
